services:
  # Векторная база данных Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # В образе нет curl/wget — используем встроенный bash /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  assessment:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    volumes:
      # Кэш эмбеддинг-модели: без него модель скачивается с HuggingFace
      # при каждом пересоздании контейнера.
      - hf_cache:/root/.cache/huggingface
      # Иллюстрации корпуса: host ./data/media <-> контейнер (раздаются по /media)
      - ./data/media:/srv/data/media
    depends_on:
      qdrant:
        condition: service_healthy
  # Добавляем n8n
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    container_name: n8n_orchestrator
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      # Переменные для связи с FastAPI.
      # ВАЖНО: имя хоста = имя сервиса в этом compose-файле ("assessment"),
      # а не "fastapi_app".
      - PYTHON_SERVICE_URL=http://assessment:8000
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  qdrant_data:
  n8n_data:
  hf_cache:

networks:
  app-network:
    driver: bridge