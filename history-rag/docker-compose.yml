services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  assessment:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      # Модель эмбеддингов скачивается с HuggingFace при первом запуске;
      # для офлайн-запуска примонтируйте кэш ~/.cache/huggingface.
    depends_on:
      - qdrant

volumes:
  qdrant_data:
