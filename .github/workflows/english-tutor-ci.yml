name: English Tutor CI

on:
  push:
    paths:
      - "English-tutor/**"
      - ".github/workflows/english-tutor-ci.yml"
  pull_request:
    paths:
      - "English-tutor/**"
      - ".github/workflows/english-tutor-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: English-tutor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -v

      - name: Build Docker image
        run: docker build -t english-tutor:ci .