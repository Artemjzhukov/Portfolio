name: history-rag tests

on:
  push:
    paths:
      - "history-rag/**"
      - ".github/workflows/history-rag-tests.yml"
    branches: [main]
  pull_request:
    paths:
      - "history-rag/**"
      - ".github/workflows/history-rag-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: history-rag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # CPU-сборка torch (как в Dockerfile), иначе linux-колёса тянут CUDA ~2.5 ГБ
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-docker.txt pytest

      - name: Run tests
        run: python -m pytest tests -q --tb=short
